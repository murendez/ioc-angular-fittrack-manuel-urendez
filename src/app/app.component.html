
<h1>FitTrack</h1>

<app-filtre-entrenaments
  (filtreAplicat)="aplicarFiltre($event)">
</app-filtre-entrenaments>

@if (entrenamentSeleccionat) {
  <h3>
    Has seleccionat: {{ entrenamentSeleccionat.nom }}
  </h3>
}

<app-llista-entrenaments
  [entrenaments]="entrenaments"
  (entrenamentSeleccionat)="seleccionarEntrenament($event)">
</app-llista-entrenaments>
