
<!-- Formulari per filtrar els entrenaments -->
<form #formulari="ngForm">
  <h2>Filtrar entrenaments</h2>

  <div>
    <label for="textCerca">Cerca un entrenament:</label>

    <input
      type="text"
      id="textCerca"
      name="textCerca"
      [(ngModel)]="textCerca"
      #cerca="ngModel"
      required
      minlength="3"
      [attr.aria-describedby]="cerca.errors?.['minlength'] && cerca.touched ? 'error-cerca' : null"
      [attr.aria-invalid]="cerca.invalid && cerca.touched"      
      placeholder="Exemple: Carrera">

    <!-- Mostrem un avís accessible quan el text és massa curt -->
    @if (cerca.errors?.['minlength'] && cerca.touched) {
      <p id="error-cerca" class="error" role="alert">
        El text ha de tenir com a mínim 3 caràcters.
      </p>
    }
  </div>

  <div>
    <label for="categoria">Categoria:</label>

    <select
      id="categoria"
      name="categoria"
      [(ngModel)]="categoriaSeleccionada">

      <option value="">Totes les categories</option>
      <option value="Running">Running</option>
      <option value="Força">Força</option>
      <option value="Ciclisme">Ciclisme</option>
      <option value="Cardio">Cardio</option>
      <option value="Mobilitat">Mobilitat</option>

    </select>
  </div>

  <!-- Desactivem el botó si el formulari no és vàlid -->
  <button
    type="button"
    (click)="aplicarFiltre()"
    [disabled]="formulari.invalid">
    Aplicar filtres
  </button>

  <!-- Netegem els camps i mostrem tots els entrenaments -->
  <button type="button" (click)="restablirFiltres()">
    Restablir filtres
  </button>
</form>
